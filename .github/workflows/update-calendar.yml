name: Update availability calendar

# GitHub Pages source must be set to GitHub Actions. A GITHUB_TOKEN push to
# gh-pages alone does not publish the changed file, so this workflow deploys
# the saved site snapshot without rebuilding the site.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch and validate availability
        run: node scripts/update-calendar.mjs
      - name: Check out published site snapshot
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
      - name: Update published calendar only
        id: update
        shell: bash
        run: |
          set -euo pipefail
          cp calendar.json published/calendar.json
          if git -C published diff --quiet -- calendar.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Published calendar has not changed.'
            exit 0
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Prepare published snapshot
        if: steps.update.outputs.changed == 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pages-publish"
          rsync -a --exclude='.git' published/ "$RUNNER_TEMP/pages-publish/"
      - name: Save calendar in published snapshot
        if: steps.update.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git -C published config user.name 'github-actions[bot]'
          git -C published config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C published add -- calendar.json
          git -C published commit -m 'Update availability calendar'
          git -C published push origin HEAD:gh-pages
      - name: Configure Pages
        if: steps.update.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - name: Upload published snapshot
        if: steps.update.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-publish
      - name: Publish calendar to GitHub Pages
        if: steps.update.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
