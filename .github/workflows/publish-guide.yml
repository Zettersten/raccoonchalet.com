name: Publish local guide

# Sunday attempts protect the publication date; daily catch-up attempts recover
# from temporary provider or runner failures. The publication gate permits one
# story per Eastern-time Sunday-to-Saturday week unless manually forced.
on:
  schedule:
    - cron: '0 9 * * 0'
      timezone: 'America/New_York'
    - cron: '17 10,12,16,20,23 * * 0'
      timezone: 'America/New_York'
    - cron: '17 9 * * 1-6'
      timezone: 'America/New_York'
  workflow_dispatch:
    inputs:
      force:
        description: Publish an extra story even if one is already published this week
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-publish
  cancel-in-progress: false
  queue: max

jobs:
  publish-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check out published site snapshot
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
      - name: Check whether this week needs a story
        id: due
        shell: bash
        env:
          FORCE_PUBLICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          set -euo pipefail
          if [[ "$FORCE_PUBLICATION" == 'true' ]]; then
            node scripts/guide-publication-gate.mjs published/guide-content.json --force
          else
            node scripts/guide-publication-gate.mjs published/guide-content.json
          fi
      - name: Install image template dependency
        if: steps.due.outputs.due == 'true'
        run: npm ci
      - name: Run publication checks
        if: steps.due.outputs.due == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm test
      - name: Research, review, and prepare one guide
        if: steps.due.outputs.due == 'true'
        id: generate
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          node scripts/publish-guide.mjs published editorial-topics.json
      - name: Require a published story when due
        if: steps.due.outputs.due == 'true' && steps.generate.outputs.changed != 'true'
        run: |
          echo '::error::A story was due but none was prepared. The next scheduled attempt will retry.'
          exit 1
      - name: Check publication file set
        if: steps.generate.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git -C published status --porcelain --untracked-files=all | sed -E 's/^...//')
          if [[ -z "$changed" ]]; then
            echo 'Generator reported a change but no published files changed.' >&2
            exit 1
          fi
          while IFS= read -r file; do
            case "$file" in
              guide-content.json|guide.html|sitemap.xml|guide/*|assets/guides/*) ;;
              *) echo "Unexpected publication file: $file" >&2; exit 1 ;;
            esac
          done <<< "$changed"
      - name: Prepare published snapshot
        if: steps.generate.outputs.changed == 'true' || steps.due.outputs.sync_due == 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pages-publish"
          rsync -a --exclude='.git' published/ "$RUNNER_TEMP/pages-publish/"
      - name: Save content artifacts in published snapshot
        if: steps.generate.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git -C published config user.name 'github-actions[bot]'
          git -C published config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C published add -- guide-content.json guide.html sitemap.xml guide assets/guides
          git -C published commit -m 'Publish local guide story'
          git -C published push origin HEAD:gh-pages
      - name: Configure Pages
        if: steps.generate.outputs.changed == 'true' || steps.due.outputs.sync_due == 'true'
        uses: actions/configure-pages@v5
      - name: Upload published snapshot
        if: steps.generate.outputs.changed == 'true' || steps.due.outputs.sync_due == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-publish
      - name: Publish guide to GitHub Pages
        if: steps.generate.outputs.changed == 'true' || steps.due.outputs.sync_due == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the guide is live
        if: steps.generate.outputs.changed == 'true' || steps.due.outputs.sync_due == 'true'
        shell: bash
        env:
          ARTICLE_URL: ${{ steps.generate.outputs.new_url || steps.due.outputs.published_url }}
        run: |
          set -euo pipefail
          if [[ -z "$ARTICLE_URL" ]]; then
            echo '::error::No article URL was available for live verification.'
            exit 1
          fi
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
              "https://raccoonchalet.com/guide-content.json?verify=${GITHUB_RUN_ID}-${attempt}" \
              --output "$RUNNER_TEMP/live-guide-content.json" \
              && cmp -s published/guide-content.json "$RUNNER_TEMP/live-guide-content.json" \
              && curl --fail --silent --show-error --location --head --connect-timeout 10 --max-time 30 \
                "${ARTICLE_URL}?verify=${GITHUB_RUN_ID}-${attempt}" --output /dev/null; then
              echo "Published guide content and ${ARTICLE_URL} are live."
              exit 0
            fi
            echo "Guide content is not live yet (attempt ${attempt}/12)."
            sleep 10
          done
          echo '::error::The guide snapshot was deployed but the live guide content did not match. A later scheduled run will retry the deployment.'
          exit 1
      - name: Notify IndexNow of the new story
        if: steps.generate.outputs.changed == 'true' || steps.due.outputs.sync_due == 'true'
        env:
          INDEXNOW_URLS: https://raccoonchalet.com/guide.html,${{ steps.generate.outputs.new_url || steps.due.outputs.published_url }}
        run: node scripts/submit-indexnow.mjs
